# 중앙 자산 경로 설정 — 가중치/데이터가 도착하면 여기만 수정하면 됨
# 서버: MS-C931, base = ~/geoit_sr_refiner

project_root: ~/geoit_sr_refiner
device: cuda

weights:
  # 🟢 확보 (Drive에서 fetch_assets.md 참고해 내려받아 여기에 배치)
  rrdb_a2v5b: weights/A2_v5b_rrdbnet_best.pth        # RRDBNet A2V5B (3m->2m)
  cyclegan_g_ab: weights/best_G_AB.pth               # CycleGAN Refiner (baseline)
  # 🔴 미수령 (기업 공유 대기) — 도착 전에는 None 처리
  hat: weights/net_g_270000.pth                      # HAT (2m->0.5m, x4) — 임계경로
  dinov3: weights/classified_DINOv3-Large_best.pth   # DINOv3 5-class 분류기

# 아키텍처 스펙 (실사·코드 근거)
arch:
  rrdb:
    filters: 64
    blocks: 8
    upscale: 1          # A2V5B는 업스케일 없음(동일 크기 보정), clamp(0,1)
  hat:
    upscale: 4
    embed_dim: 180
    window_size: 16
    key: params_ema     # net_g_270000.pth는 EMA 가중치
  cyclegan:
    residual_blocks: 9  # ResNet gen, InstanceNorm, Tanh
  dinov3:
    model_name: vit_large_patch16_dinov3
    num_classes: 5
    img_size: 224
    sc_feature_stage: forward_features  # SC Loss는 분류 헤드 대신 토큰 피처 사용

data:
  # 샘플셋 (Drive: sr_data_sample.zip 27.8MB) — 파이프 검증용
  sample_root: data/sr_data_sample
  # 실전 페어 (10,200장) — 메일 공유 대기
  paired_root: data/paired_10200          # {hr, lr} — 정량평가(Track1)
  # unpaired HR 도메인 (AI Hub/국토정보) — refiner 타겟 도메인
  hr_domain_root: data/hr_domain          # Track2 target
  # SR_Output (리파이너 입력 소스). HAT 없으면 기업 제공 sr 페어 사용
  sr_output_root: data/sr_output
  degrade: very_strong                    # Real-ESRGAN 2차 합성 열화 (추정)

eval:
  # 규약을 먼저 고정: PSNR data_range를 어디에 맞출지 (실사 §7: 36.36 vs 17.72 이슈)
  psnr_data_range: 1.0     # [0,1] 텐서 기준. 8bit면 255.0
  paired_metrics: [psnr, ssim, lpips]     # Track1 (GT 존재)
  unpaired_metrics: [fid, niqe]           # Track2 (GT 없음)
  crop_border: 0
